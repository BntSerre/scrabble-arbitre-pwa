<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4dc"/>
      <stop offset="50%" stop-color="#f3dfb2"/>
      <stop offset="100%" stop-color="#cbaf74"/>
    </linearGradient>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)"/>
  <rect x="3" y="3" width="186" height="186" rx="39" fill="none" stroke="#10b981" stroke-width="3" stroke-opacity="0.4"/>

  <!-- Scrabble Wooden Tile -->
  <rect x="36" y="36" width="120" height="120" rx="16" fill="url(#tileGrad)" filter="url(#tileShadow)"/>
  <rect x="37" y="37" width="118" height="118" rx="15" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Letter 'S' -->
  <text x="88" y="116" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="82" fill="#1c1917" text-anchor="middle">S</text>

  <!-- Score Value '1' -->
  <text x="138" y="142" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="24" fill="#1c1917" text-anchor="end">1</text>
  
  <!-- AI Check Badge -->
  <circle cx="144" cy="48" r="16" fill="#10b981"/>
  <path d="M137 48l5 5 10-10" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
