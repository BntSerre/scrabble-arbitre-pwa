<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4dc"/>
      <stop offset="50%" stop-color="#f3dfb2"/>
      <stop offset="100%" stop-color="#cbaf74"/>
    </linearGradient>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#10b981" stroke-width="6" stroke-opacity="0.5"/>

  <!-- Scrabble Wooden Tile -->
  <rect x="96" y="96" width="320" height="320" rx="42" fill="url(#tileGrad)" filter="url(#tileShadow)"/>
  <rect x="98" y="98" width="316" height="316" rx="40" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.6"/>

  <!-- Letter 'S' -->
  <text x="235" y="310" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="220" fill="#1c1917" text-anchor="middle">S</text>

  <!-- Score Value '1' -->
  <text x="375" y="380" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="64" fill="#1c1917" text-anchor="end">1</text>
  
  <!-- AI Check Badge -->
  <circle cx="385" cy="125" r="42" fill="#10b981"/>
  <path d="M366 125l13 13 26-26" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
